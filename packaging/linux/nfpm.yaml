# nfpm config for the .deb, .rpm and Arch .pkg.tar.zst — consumed by
# linux-release-kit's release.yml. The file layout is NOT declared here:
# the workflow's build_command stages it with the justfile's own
# `just rootdir=... install`, and the single tree entry below packages
# whatever the justfile installed. One source of truth for the layout.
#
# The RK_* variables are exported by the release workflow; nfpm expands
# ${VAR} itself. You never edit the version here.

name: magnetar-accounts
arch: ${RK_DEB_ARCH}
platform: linux
version: ${RK_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Dominikos Pritis <dominikos.pritis@gmail.com>
vendor: entro314-labs
homepage: https://github.com/Magnetar-OS/magnetar-accounts
license: GPL-3.0-only
description: |
  Online accounts for the COSMIC desktop: sign in once, and mail, calendars and contacts follow

# Runtime dependencies, per distro. The libraries are what `ldd` shows for
# the binary: libxkbcommon, and OpenSSL for the TLS of the mail and DAV
# logins it tries (SQLite is bundled). The arch names are validated for real
# by arch-repo.yml's container install test.
#
# GNOME Online Accounts is optional, and declared by what happens without it:
# the Online Accounts route is not offered, and `adopt` says there is nothing
# to bring in.
# `gnome-online-accounts` is the daemon that holds the sign-ins;
# `gnome-online-accounts-gtk` is its window outside GNOME, which this app
# opens for adding one. Suggested, not recommended: on Debian a recommendation
# installs by default, and the daemon pulls in a GNOME stack nobody asked for.
#
# nfpm's Arch packager writes `depend` only — it has no optdepends — so on
# Arch the suggestion has nowhere to go and is left out rather than made
# a hard dependency.
overrides:
  deb:
    depends:
      - libxkbcommon0
      - libssl3
    suggests:
      - gnome-online-accounts
      - gnome-online-accounts-gtk
  rpm:
    depends:
      - libxkbcommon
      - openssl-libs
    suggests:
      - gnome-online-accounts
      - gnome-online-accounts-gtk
  archlinux:
    depends:
      - libxkbcommon
      - openssl

contents:
  # Everything `just rootdir=.release-kit/pkgroot install` staged: binaries,
  # desktop entries, icons, metainfo, services — applets and daemons
  # included. Modes are preserved from the staging tree.
  #
  # One tree per top-level directory, NOT a single tree at `/`: a tree whose
  # dst is `/` makes nfpm emit a tar entry with an empty name, and bsdtar
  # errors out on it ("Archive entry has empty or unreadable filename"), so
  # `repo-add` rejects the Arch package as "not a package file" and the pacman
  # repository never updates. The .deb and .rpm tolerate it, which is why this
  # only ever shows up on Arch.
  #
  # This justfile installs under the prefix only. A new top-level directory in
  # the install tree needs a new entry here.
  - src: .release-kit/pkgroot/usr
    dst: /usr
    type: tree
  # The first-login welcome's autostart entry, in /etc/xdg/autostart.
  - src: .release-kit/pkgroot/etc
    dst: /etc
    type: tree
